description: "This Dandiset contains all raw and primary-processed data underlying
  the study “State-dependent modulation of striatal spiny projection neurons controls
  levodopa-induced dyskinesia in a mouse model of Parkinson’s disease”\nThe collection
  spans multimodal recordings from adult C57BL/6J mice rendered hemiparkinsonian with
  a unilateral 6-hydroxydopamine (6-OHDA) lesion of the medial forebrain bundle, followed
  by chronic levodopa dosing to provoke on-/off-state dyskinesia"
